name: Bug report
description: Report something that doesn't work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, credentials, or sensitive trace information.**
        Redact usernames in paths, internal IPs/hostnames, and anything
        confidential before submitting. For security vulnerabilities, use
        private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: GhostGlass version
      description: Output of `ghostglass --version`
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      description: e.g. Ubuntu 24.04, Fedora 41
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.x"
    validations:
      required: true
  - type: input
    id: strace
    attributes:
      label: strace version
      description: Output of `strace --version | head -1`
      placeholder: "strace 6.x"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command used
      description: The exact ghostglass command you ran (redact anything sensitive)
      placeholder: "ghostglass run -- npm install express"
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error output
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help (logs, screenshots)
