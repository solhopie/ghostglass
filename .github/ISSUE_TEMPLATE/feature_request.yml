name: Feature request
description: Suggest an idea for GhostGlass
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        GhostGlass is local-first: no accounts, no telemetry, no cloud, no AI.
        Proposals that require phoning home will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who is it for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should GhostGlass do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, and why they fall short
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples, references
