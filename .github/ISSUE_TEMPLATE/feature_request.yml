name: Feature request
description: Suggest an idea for GhostGlass
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        GhostGlass is local-first: no accounts, no telemetry, no cloud, no AI.
        Proposals that require phoning home will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who is it for?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: How would a user do this with GhostGlass?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Example command
      description: The ghostglass command(s) this would add or change
      render: shell
  - type: textarea
    id: fit
    attributes:
      label: Why it belongs in GhostGlass
      description: Why is this a tracing/replay problem rather than something else?
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples, references
